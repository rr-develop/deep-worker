]
"deep_worker_cli/built_in_skills/skill-creator/scripts/quick_validate.py" = [
    "ANN001",   # Missing type annotation for function argument
    "ANN201",   # Missing return type annotation for public function
    "INP001",   # Implicit namespace package
    "N806",     # Variable in function should be lowercase
    "PLR2004",  # Magic value used in comparison
    "T201",     # `print` found
]

[tool.coverage.run]
omit = ["tests/*"]

[tool.pytest.ini_options]
# timeout = 30  # Default timeout for all tests (requires pytest-timeout plugin)

# Default run skips the `tests/integration/` suite and the
# `tests/integration_ai/` real-agent suite — those require a live
# deep-worker agent process and / or use the same-process
# AsyncioServer+client topology that rpyc_async now forbids. Run
# them deliberately with `pytest -m integration` or by pointing at
# the directory.
addopts = "--strict-markers --strict-config --durations=5 -m 'not integration'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

markers = [
    "reuse_agent: Do not kill existing agent process, reuse it for debugging (default: kill old process)",
    "integration: Integration tests that require real agents or run AsyncioServer+client in-process (select with '-m integration'; deselected by default)",
]
