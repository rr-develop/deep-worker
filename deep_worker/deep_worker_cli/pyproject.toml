[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deep-worker"
version = "0.0.19"
description = "Terminal interface for Deep Agents - interactive AI agent with file operations, shell access, and sub-agent capabilities."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<4.0"
keywords = ["agents", "ai", "cli", "terminal", "llm", "langgraph", "langchain", "deep-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Terminals",
]
dependencies = [
  # Framework
  "deepagents==0.3.12",
  "langchain>=1.2.7,<2.0.0",
  "langchain-openai>=1.1.7,<2.0.0",
  "langgraph-checkpoint-sqlite>=3.0.0,<4.0.0",

  # UI/Terminal
  "textual>=6.0.0,<8.0.0",
  "textual-autocomplete>=3.0.0,<5.0.0",
  "prompt-toolkit>=3.0.52,<4.0.0",
  "rich>=14.0.0,<15.0.0",
  "markdownify>=0.13.0,<2.0.0",

  # Sandbox integrations
  "daytona>=0.113.0,<1.0.0",
  "langsmith>=0.6.6",
  "modal>=0.65.0,<2.0.0",
  "runloop-api-client>=0.69.0",

  # Tools
  "tavily-python>=0.7.21,<1.0.0",

  # Clipboard
  "pyperclip>=1.11.0,<2.0.0",

  # IPC/RPC
  "rpyc>=6.0.0,<7.0.0",
  "arpyc",  # in-repo package at ../../arpyc; see [tool.uv.sources] below

  # Utilities
  "python-dotenv>=1.0.0,<2.0.0",
  "requests>=2.0.0,<3.0.0",
  "pillow>=10.0.0,<13.0.0",
  "pyyaml>=6.0.0",
  "aiosqlite>=0.19.0,<1.0.0",
]

[project.optional-dependencies]
vertexai = ["langchain-google-vertexai>=3.0.0,<4.0.0"]

[project.scripts]
deep-worker = "deep_worker_cli.cli.router:deep_worker_main"
deep-worker-cli = "deep_worker_cli.cli.router:deep_worker_cli_main"
dwcli = "deep_worker_cli.cli.router:deep_worker_cli_main"

[project.urls]
Homepage = "https://docs.langchain.com/oss/python/deepagents/overview"
Documentation = "https://reference.langchain.com/python/deepagents/"
Repository = "https://github.com/langchain-ai/deepagents"
Issues = "https://github.com/langchain-ai/deepagents/issues"
Changelog = "https://github.com/langchain-ai/deepagents/blob/master/libs/cli/CHANGELOG.md"
Twitter = "https://x.com/LangChain"

[dependency-groups]
test = [
    "build>=1.0.0,<2.0.0",
    "ruff>=0.14.0,<1.0.0",
    "ty>=0.0.1,<1.0.0",
    "pytest>=8.3.4,<10.0.0",
    "pytest-asyncio>=0.25.3,<2.0.0",
    "pytest-cov>=6.0.0,<8.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "pytest-socket>=0.7.0,<1.0.0",
    "pytest-timeout>=2.3.1,<3.0.0",
    "pytest-watcher>=0.3.4,<1.0.0",
    "pytest-xdist>=3.8.0,<4.0.0",
    "responses>=0.25.0,<1.0.0",
    "twine>=6.0.0,<7.0.0",
    "pyte>=0.8.2,<1.0.0",  # Terminal emulator for UI testing
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["deep_worker_cli"]

[tool.hatch.build.targets.wheel.shared-data]
"deep_worker_cli/default_agent_prompt.md" = "deep_worker_cli/default_agent_prompt.md"
"deep_worker_cli/*.tcss" = "deep_worker_cli/"

[tool.uv.sources]
deepagents = { path = "../deepagents", editable = true }
arpyc = { path = "../../arpyc", editable = true }

[tool.ty.environment]
extra-paths = ["../deepagents"]

[tool.ty.rules]
# https://docs.astral.sh/ty/rules/
# Type checking is performed via pyright (configured in pyrightconfig.json)
# Pre-commit hook uses: uv run --all-groups ty check deep_worker_cli
# This includes tests/integration_ai/ as specified in pyrightconfig.json

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 100

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "C90",     # McCabe complexity
    "COM812",  # Messes with the formatter
    "CPY",     # No copyright
    "FBT",     # Boolean positional arguments (too pedantic)
    "FIX002",  # Line contains TODO
    "ISC001",  # Messes with the formatter
    "PERF203", # Rarely useful
    "PLR09",   # Too many something (args, branches, returns, statements, etc)
    "PLR1702", # Too many nested blocks
    "SLF001",  # Private member access
    "PLC0414", # Inconsistent with how type checkers expect to be notified of intentional re-exports
    "TD002",   # Missing author in TODO
    "TD003",   # Missing issue link in TODO
]
unfixable = ["B028"] # People should intentionally tune the stacklevel

flake8-annotations.allow-star-arg-any = true
flake8-annotations.mypy-init-return = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
force-single-line = false
combine-as-imports = true
known-first-party = ["deepagents_cli"]

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-var-parameters = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN001", "ANN201", "D1", "DOC", "F401", "PLC1901", "PLC2701", "PLR2004", "PLR6201", "PLR6301", "PLW0108", "RUF001", "S", "SLF"]
"tests/unit_tests/test_imports.py" = ["PLC0415"]  # Imports inside function ARE the test
"scripts/**" = ["BLE001", "INP", "S", "T201"]
"deep_worker_cli/agent.py" = [
    "PLR2004",  # Magic value used in comparison
    "SIM108",   # Use ternary operator instead of if-else
]
"deep_worker_cli/app.py" = [
    "ANN401",   # Dynamically typed expressions (typing.Any) are disallowed
    "ARG002",   # Unused method argument
    "ASYNC110", # Use `asyncio.Event` instead of busy-waiting
    "BLE001",   # Do not catch blind exception
    "PLC0415",  # Lazy import for startup performance and optional deps
    "PLR2004",  # Magic value used in comparison
    "SIM108",   # Use ternary operator instead of if-else
]
"deep_worker_cli/backends.py" = [
    "PLC0415",  # Lazy import for monkey-patching at runtime
]
"deep_worker_cli/cli.py" = [
    "T201",     # `print` found
]
"deep_worker_cli/clipboard.py" = [
    "BLE001",   # Do not catch blind exception
    "PLC0415",  # Lazy import for optional dependency (pyperclip)
]
"deep_worker_cli/config.py" = [
    "ERA001",   # Found commented-out code
    "PLC0415",  # Conditional imports for model providers
    "PLR2004",  # Magic value used in comparison
]
"deep_worker_cli/file_ops.py" = [
    "ANN401",   # Dynamically typed expressions (typing.Any) are disallowed
    "BLE001",   # Do not catch blind exception
]
"deep_worker_cli/image_utils.py" = [
    "BLE001",   # Do not catch blind exception
]
"deep_worker_cli/input.py" = [
    "BLE001",   # Do not catch blind exception
    "PLR6301",  # Method could be a function or static method
]
"deep_worker_cli/integrations/daytona.py" = [
    "PLC0415",  # Lazy import for optional dependency (daytona)
]
"deep_worker_cli/integrations/langsmith.py" = [
    "PLC0415",  # Lazy import for optional dependency (langsmith)
]
"deep_worker_cli/integrations/modal.py" = [
    "PLC0415",  # Lazy import for optional dependency (modal)
]
"deep_worker_cli/integrations/runloop.py" = [
    "B904",     # Within an `except` clause, raise exceptions with `raise ... from err`
]
"deep_worker_cli/integrations/sandbox_factory.py" = [
    "BLE001",   # Do not catch blind exception
]
"deep_worker_cli/core/sessions.py" = [
    "ANN401",   # Dynamically typed expressions (typing.Any) are disallowed
    "BLE001",   # Do not catch blind exception
]
"deep_worker_cli/core/ui_display_types.py" = [
    "A003",     # Class attribute shadows a Python builtin
]
"deep_worker_cli/local_context.py" = [
    "ARG002",   # Unused method argument
    "BLE001",   # Do not catch blind exception
]
"deep_worker_cli/project_utils.py" = [
    "ERA001",   # Found commented-out code
]
"deep_worker_cli/skills/commands.py" = [
    "ANN401",   # Dynamically typed expressions (typing.Any) are disallowed
    "ISC003",   # Explicitly concatenated string should be implicitly concatenated
]
"deep_worker_cli/skills/load.py" = [
    "PLC2701",  # Private name import
]
"deep_worker_cli/textual_adapter.py" = [
    "ANN401",   # Dynamically typed expressions (typing.Any) are disallowed
    "BLE001",   # Do not catch blind exception
    "PLR2004",  # Magic value used in comparison
    "TRY203",   # Use `raise` without arguments inside exception handler
]
"deep_worker_cli/tools.py" = [
    "ANN201",   # Missing return type annotation for public function
    "BLE001",   # Do not catch blind exception
    "E722",     # Do not use bare `except`
    "PLR2004",  # Magic value used in comparison
]
"deep_worker_cli/ui.py" = [
    "ANN401",   # Dynamically typed expressions (typing.Any) are disallowed
    "ARG002",   # Unused method argument
    "BLE001",   # Do not catch blind exception
    "PLR2004",  # Magic value used in comparison
]
"deep_worker_cli/widgets/approval.py" = [
    "A002",     # Argument shadows a Python builtin
    "ARG002",   # Unused method argument
    "B007",     # Loop control variable not used within the loop body
    "RUF001",   # String contains ambiguous character
]
"deep_worker_cli/widgets/chat_input.py" = [
    "ARG002",   # Unused method argument
    "PLR6301",  # Method could be a function or static method
]
"deep_worker_cli/widgets/messages.py" = [
    "PLR6301",  # Method could be a function or static method
]
"deep_worker_cli/widgets/status.py" = [
    "PLR2004",  # Magic value used in comparison
    "PLR6301",  # Method could be a function or static method
]
"deep_worker_cli/widgets/tool_widgets.py" = [
    "PLR6301",  # Method could be a function or static method
]
"deep_worker_cli/widgets/tool_renderers.py" = [
    "D102",     # Missing docstring in public method
    "PLR2004",  # Magic value used in comparison
]
"deep_worker_cli/main.py" = [
    "BLE001",   # Do not catch blind exception
    "PLC0415",  # Lazy import to avoid circular dependency
    "T201",     # `print` found
]
"examples/skills/arxiv-search/arxiv_search.py" = [
    "BLE001",   # Do not catch blind exception
    "PLC0415",  # Lazy import for optional dependency (arxiv)
    "TRY300",   # Consider moving this statement to an `else` block
]
"examples/skills/skill-creator/scripts/init_skill.py" = [
    "ANN001",   # Missing type annotation for function argument
    "ANN201",   # Missing return type annotation for public function
    "BLE001",   # Do not catch blind exception
    "PLR2004",  # Magic value used in comparison
    "T201",     # `print` found
]
"examples/skills/skill-creator/scripts/quick_validate.py" = [
    "ANN001",   # Missing type annotation for function argument
    "ANN201",   # Missing return type annotation for public function
    "N806",     # Variable in function should be lowercase
    "PLR2004",  # Magic value used in comparison
    "T201",     # `print` found
]
"deep_worker_cli/built_in_skills/skill-creator/scripts/init_skill.py" = [
    "ANN001",   # Missing type annotation for function argument
    "ANN201",   # Missing return type annotation for public function
    "BLE001",   # Do not catch blind exception
    "INP001",   # Implicit namespace package
    "PLR2004",  # Magic value used in comparison
    "T201",     # `print` found
]
"deep_worker_cli/built_in_skills/skill-creator/scripts/quick_validate.py" = [
    "ANN001",   # Missing type annotation for function argument
    "ANN201",   # Missing return type annotation for public function
    "INP001",   # Implicit namespace package
    "N806",     # Variable in function should be lowercase
    "PLR2004",  # Magic value used in comparison
    "T201",     # `print` found
]

[tool.coverage.run]
omit = ["tests/*"]

[tool.pytest.ini_options]
# timeout = 30  # Default timeout for all tests (requires pytest-timeout plugin)

addopts = "--strict-markers --strict-config --durations=5"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
