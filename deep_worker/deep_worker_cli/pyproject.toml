[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "deep-worker"
version = "0.0.22"
description = "Terminal interface for Deep Worker - interactive AI agent with file operations, shell access, and sub-agent capabilities."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<4.0"
keywords = ["agents", "ai", "cli", "terminal", "llm", "langgraph", "langchain", "deep-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Terminals",
]
dependencies = [
  # Framework
  #
  # langchain* / langgraph* are pinned to exact versions matching the
  # host's system-installed packages. Open ranges produced silent API
  # drift between the type-check uv-venv (which was getting the latest
  # PyPI release) and pytest (running against the system install) —
  # see ``.githooks/pre-commit`` 2026-04-25 incident note and the
  # subagent recursion_limit bug fixed in
  # deepagents/middleware/subagents.py.
  #
  # NOTE: `deepagents` is NOT a runtime dependency — the in-tree fork
  # (deep_worker/deepagents/) is vendored into the wheel/sdist via
  # [tool.hatch.build.targets.*.force-include] (owner decision
  # 2026-08-11). Its runtime deps (langchain-core, langchain-anthropic,
  # wcmatch) are declared here explicitly; the fork itself is kept
  # importable for local development via [dependency-groups] test +
  # [tool.uv.sources] (see below).
  "langchain==1.2.9",
  "langchain-core==1.2.9",
  "langchain-anthropic==1.3.2",
  "langchain-openai==1.1.7",
  # langgraph*: pinned to the last versions compatible with langchain 1.2.9.
  # langgraph-prebuilt>=1.0.9 imports ExecutionInfo from langgraph.runtime,
  # which does not exist in any langgraph 1.0.x release — a plain
  # `pip install deep-worker` would resolve prebuilt 1.0.13 + langgraph
  # 1.0.10 and crash at import time (verified 2026-08-11). The host pair
  # langgraph 1.0.8 + langgraph-prebuilt 1.0.7 is the last known-good
  # combination and is pinned here.
  "langgraph==1.0.8",
  "langgraph-prebuilt==1.0.7",
  # DeepSeek thinking models (deepseek-v4-flash) require reasoning_content to
  # be round-tripped; we build them with ReasoningChatDeepSeek (subclass of
  # ChatDeepSeek). Pinned exact to match the host install. See
  # deepseek_model.py and DEEPSEEK_PROVIDER.md (2026-05-22).
  "langchain-deepseek==1.0.1",
  "langgraph-checkpoint-sqlite==3.0.3",
  # Google Gemini (API provider, core per the capability matrix).
  # Pinned exact to match the vendored deepagents fork pin and the
  # host install; a bare range lets pip resolve a newer patch in CI
  # and trips the pin-drift guard (test_pinned_versions_match_runtime).
  "langchain-google-genai==4.2.0",

  # UI/Terminal
  "textual>=6.0.0,<8.0.0",
  "textual-autocomplete>=3.0.0,<5.0.0",
  "prompt-toolkit>=3.0.52,<4.0.0",
  "rich>=14.0.0,<15.0.0",
  "markdownify>=0.13.0,<2.0.0",

  # Sandbox integrations
  "daytona>=0.113.0,<1.0.0",
  # Pin to the 0.6.x series: 0.7+ removed SandboxTemplate and the
  # get_template / create_template APIs that integrations/langsmith.py
  # uses. A rewrite against the new snapshot-based API is tracked
  # separately; until then, stay on 0.6.
  "langsmith>=0.6.6,<0.7",
  "modal>=0.65.0,<2.0.0",
  "runloop-api-client>=0.69.0",

  # Tools
  "tavily-python>=0.7.21,<1.0.0",
  # External MCP clients (stdio + streamable HTTP). Exact host-compatible pin.
  "mcp==1.17.0",
  # Upper bound demanded by the ``mcp==1.17.0`` pin above, NOT a preference.
  # ``mcp`` 1.17.0 imports a private symbol that pydantic dropped in 2.14.0:
  #     mcp/server/fastmcp/utilities/func_metadata.py:17
  #     from pydantic._internal._typing_extra import eval_type_backport
  # pydantic is otherwise unconstrained here and arrives transitively via
  # langchain (>=2.7.4), so a fresh resolve took 2.14.0 and ``import
  # mcp.types`` died at collection time — turning every CI run red while
  # developer machines, holding an older pydantic, stayed green. Bisected:
  # 2.13.0 imports fine, 2.14.0 does not. Lift this when the ``mcp`` pin
  # moves to >=1.30.0, which stopped importing the private symbol.
  "pydantic<2.14",

  # Clipboard
  "pyperclip>=1.11.0,<2.0.0",

  # IPC/RPC — AsyncioServer-based RPyC fork.
  # This pin is only the FALLBACK: a local rpyc_async source checkout wins over
  # any installed distribution (owner decision 2026-10-11, implemented in
  # deep_worker_cli/rpyc_async_source.py). Being the fallback is exactly why
  # it must not understate the requirement — the fallback is what a pip user
  # actually gets.
  #
  # The floor is 1.1.0 because `rpyc_async.core.netref.async_call` — called
  # by deep_worker_web.app.services.mcp_service — and
  # `rpyc_async.utils.helpers.fire_and_forget_call` do not exist in 1.0.0.
  # Verified by downloading both wheels: 1.0.0 exposes neither, 1.1.0
  # (published 2026-10-11) exposes both. Under >=1.0.0 a resolver was free
  # to install a web UI that cannot send inter-agent messages, with nothing
  # in the metadata saying so.
  "rpyc-async>=1.1.0",

  # Utilities
  "python-dotenv>=1.0.0,<2.0.0",
  "requests>=2.0.0,<3.0.0",
  "pillow>=10.0.0,<13.0.0",
  "pyyaml>=6.0.0",
  "aiosqlite>=0.19.0,<1.0.0",
  # Vendored deepagents backends/filesystem.py + backends/utils.py use
  # wcmatch.glob (fork runtime dep moved into deep_worker_cli).
  "wcmatch>=8.5.0,<11.0.0",

  # Vendored provider runtimes (deep_worker/providers/<pkg> ships inside the
  # wheel/sdist). The codex/grok proxy
  # MCP servers (streamable HTTP) run uvicorn + Starlette in-process; these
  # are core deps because codex/grok are core providers.
  "uvicorn>=0.24.0",
  "starlette>=0.27.0",

  # Web UI (deep_worker_cli/web/, staged into the wheel by
  # hooks/stage_providers.py and launched by `deep-worker --web`).
  #
  # CORE, not an extra: a user who runs `pip install deep-worker` must get a
  # working web UI without knowing an extra exists (owner requirement
  # 2026-10-13). The earlier [web] extra is gone for that reason.
  #
  # The set is derived from the import statements in deep_worker_web/app/**
  # and run.py (23 files, 35 distinct top-level names), NOT from
  # deep_worker_web/requirements.txt — that file lists packages no import
  # asks for. Of the eight third-party names the web code imports, five are
  # already declared above: uvicorn, starlette, pydantic, mcp, rpyc-async.
  # These are the remaining three.
  #
  # Deliberately absent, each verified by probing the imports:
  #   jinja2           reached only via fastapi.templating, and the dead
  #                    app/templates/ branch that used it has been removed
  #   python-multipart no import site
  #   websockets       WS is served through Starlette/FastAPI
  # uvicorn[standard] is not needed either — nothing imports its extras.
  "fastapi",
  "pydantic-settings",
  "anyio",

  # LSP shared-service (see docs/DESIGN_LSP_SHARED_SERVICE.md).
  # Pinned to the 1.76.x line: 1.83+ pulls in protobuf 7.x and breaks
  # grpcio-status / google-api-core / google-cloud-firestore on this
  # host — see deep_worker_cli/lsp/service/README.md for the full
  # ecosystem rationale. Runtime dependency of the service process AND
  # the in-agent MCP↔gRPC bridge (thin adapter under policy §5).
  "grpcio>=1.76,<1.77",
  # File-system watcher for the LSP service change-detector (event-
  # driven, no polling — POLICY_NO_INPROCESS_HEAVY_MCP §3.5). Declared
  # here so the type checker sees it as early as commit 3, though the
  # first import site lands in commit 5.
  "watchfiles>=1.1,<2.0",
]

[project.optional-dependencies]
vertexai = ["langchain-google-vertexai>=3.0.0,<4.0.0"]
# Vendored semantic-search provider: the heavy llama-index stack stays out of
# core. Runtime set mirrors
# requirements-semantic-search.txt minus the test-only entries.
semantic-search = [
    "llama-index-core>=0.10.0",
    "llama-index-vector-stores-lancedb>=0.4.0",
    "llama-index-embeddings-huggingface>=0.4.0",
    "lancedb>=0.20.0",
    "tree-sitter-language-pack>=0.13.0",
    "pandas>=2.0.0",
]
# Vendored A2A provider: a2a-sdk (1.1.x is the version the protocol support
# was built and integration-tested against). Core starts without it; the
# agent's A2A server/client only activates when the extra is installed.
a2a = ["a2a-sdk[http-server]>=1.1.0"]
# NOTE: there is deliberately no `web` extra. The web UI's requirements are
# CORE dependencies — see the "Web UI" block in [project.dependencies].
# `pip install deep-worker` must yield a working `deep-worker --web`.

[project.urls]
Homepage = "https://github.com/rr-develop/deep-worker"
Source = "https://github.com/rr-develop/deep-worker"
Repository = "https://github.com/rr-develop/deep-worker"
Issues = "https://github.com/rr-develop/deep-worker/issues"

[project.scripts]
deep-worker = "deep_worker_cli.cli.router:deep_worker_main"
deep-worker-cli = "deep_worker_cli.cli.router:deep_worker_cli_main"
dwcli = "deep_worker_cli.cli.router:deep_worker_cli_main"

[dependency-groups]
test = [
    "build>=1.0.0,<2.0.0",
    "ruff>=0.14.0,<1.0.0",
    "ty>=0.0.1,<1.0.0",
    "pytest>=8.3.4,<10.0.0",
    "pytest-asyncio>=0.25.3,<2.0.0",
    "pytest-cov>=6.0.0,<8.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "pytest-socket>=0.7.0,<1.0.0",
    "pytest-timeout>=2.3.1,<3.0.0",
    "pytest-watcher>=0.3.4,<1.0.0",
    "pytest-xdist>=3.8.0,<4.0.0",
    "responses>=0.25.0,<1.0.0",
    "twine>=6.0.0,<7.0.0",
    "pyte>=0.8.2,<1.0.0",  # Terminal emulator for UI testing
    # Local-dev seam for the VENDORED deepagents fork (owner decision
    # 2026-08-11): the fork is NOT a runtime dependency (it ships inside
    # the wheel via force-include), but local dev / tests / type-check
    # still need it importable. PEP 735 groups do NOT land in wheel
    # METADATA, so this keeps `pip install deep-worker` free of any
    # `Requires-Dist: deepagents`. Resolved as editable from
    # ../deepagents via [tool.uv.sources] below.
    "deepagents",
    # Regenerating LSP-service gRPC stubs (see
    # deep_worker_cli/lsp/service/proto/lsp_service.proto). Kept in
    # `test` group because the pre-commit uv env pulls it in for the
    # type-check pass — same MAJOR/MINOR as grpcio (1.76.x) per the
    # ecosystem pin explained in lsp/service/README.md.
    "grpcio-tools>=1.76,<1.77",
]

# ---------------------------------------------------------------------------
# Packaging (hatchling). The vendored deepagents fork and the LICENSE file
# are force-included in BOTH wheel and sdist via the `deepagents` / `LICENSE`
# paths relative to THIS project root:
#
#   deep_worker_cli/deepagents  → symlink → ../deepagents/deepagents
#                                 (the in-tree fork; the symlink makes the
#                                 same relative path valid inside the
#                                 extracted sdist — R1)
#   deep_worker_cli/LICENSE     → copy of the repo-root MIT LICENSE
#                                 (drift-guarded by a unit test)
#
# `allow-direct-references` is ABSENT because no dependency is declared as a
# direct URL any more: `rpyc-async` is a plain version pin. That is a
# packaging fact about this file only — it is NOT a prohibition on running
# from a local checkout, which takes priority at runtime (see the
# `rpyc-async` pin above and deep_worker_cli/rpyc_async_source.py).
# ---------------------------------------------------------------------------
# Vendored providers: the five
# deep_worker/providers/<pkg> packages are staged into the wheel/sdist by a
# custom hatchling hook (hooks/stage_providers.py). There are NO static
# force-includes for providers here — all source→dest mappings are set
# programmatically by the hook, per target.
[tool.hatch.build.hooks.custom]
path = "hooks/stage_providers.py"

[tool.hatch.build.targets.wheel]
packages = ["deep_worker_cli"]

[tool.hatch.build.targets.wheel.force-include]
"deepagents" = "deepagents"
"LICENSE" = "LICENSE"

[tool.hatch.build.targets.wheel.shared-data]
"deep_worker_cli/default_agent_prompt.md" = "deep_worker_cli/default_agent_prompt.md"
"deep_worker_cli/*.tcss" = "deep_worker_cli/"

[tool.hatch.build.targets.sdist.force-include]
"deepagents" = "deepagents"
"LICENSE" = "LICENSE"

[tool.uv.sources]
deepagents = { path = "../deepagents", editable = true }

[tool.ty.environment]
# ═══════════════════════════════════════════════════════════════════════════
# extra-paths is SAFETY-CRITICAL. DO NOT REMOVE ENTRIES without replacing
# them with a working equivalent. In particular:
#
#   rpyc_async — resolved by `ty` from the installed distribution, which is
#         enough for type checking the AsyncioServer entry points:
#           - `rpyc_async.core.async_connect.async_connect`  (async client)
#           - `Connection.aclose()`                          (async close)
#           - `Connection.wait_closed()`                     (async close wait)
#           - `Connection.add_close_callback(cb)`
#         Note this is a TYPE-CHECKING arrangement only. At RUNTIME a local
#         rpyc_async checkout takes priority over the installed distribution
#         (owner decision 2026-10-11, deep_worker_cli/rpyc_async_source.py),
#         so `ty` may be reading an older API surface than the code runs
#         against. If a symbol exists in the checkout but not in the installed
#         package, `ty` will flag it — add the checkout to extra-paths rather
#         than silencing with `# ty: ignore`.
#
# If you are tempted to bypass type checks: don't. Fix the path here
# or fix the real type error. There are no third options.
# ═══════════════════════════════════════════════════════════════════════════
# Paths are tree-relative (../../  = <repo>/, ../  = <repo>/deep_worker/).
# Using ../.. instead of a hard-coded absolute path means this file works
# identically in the production tree and in a developer tree.
# Hard-coding the production path caused
# `ty check` to fail in the dev tree: it would add BOTH the prod
# deep_worker_cli (via extra-paths) and the dev deep_worker_cli (via cwd)
# to the module-resolution path, then refuse to resolve relative imports
# like `from .task_manager import …` because two copies of the same
# package were visible. See docs/DESIGN_DEV_FLAG.md.
extra-paths = [
    ".",
    "..",  # ← <repo>/deep_worker — exposes `deepworker_a2a` (optional A2A
           #   protocol package). agent_process.py imports it lazily and
           #   gracefully when A2A is enabled; ty must still resolve the
           #   import to type-check the integration code path.
    "../..",
    "../../semantic_search",
    "../deepagents",
    # Source fork of claude_agent_sdk (CLAUDE_AGENT_SDK_SRC contract):
    # the vendored
    # claude_code_sdk_provider imports `claude_agent_sdk._mcp_context` lazily.
    # ty needs the fork on the search path to type-check that code path.
    # Mirrors the Claude SDK source entry already in pyrightconfig.json.
    # (A sibling checkout of the repository root, in both trees.)
    "../../../claude_sdk/src",
]

[tool.ty.rules]
# https://docs.astral.sh/ty/rules/
# Type checking is performed via pyright (configured in pyrightconfig.json)
# Pre-commit hook uses: uv run --all-groups ty check deep_worker_cli
# This includes tests/integration_ai/ as specified in pyrightconfig.json
invalid-key = "ignore"
unresolved-reference = "ignore"
unknown-argument = "ignore"
invalid-argument-type = "ignore"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 100

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "C90",     # McCabe complexity
    "COM812",  # Messes with the formatter
    "CPY",     # No copyright
    "FBT",     # Boolean positional arguments (too pedantic)
    "FIX002",  # Line contains TODO
    "ISC001",  # Messes with the formatter
    "PERF203", # Rarely useful
    "PLR09",   # Too many something (args, branches, returns, statements, etc)
    "PLR1702", # Too many nested blocks
    "SLF001",  # Private member access
    "PLC0414", # Inconsistent with how type checkers expect to be notified of intentional re-exports
    "TD002",   # Missing author in TODO
    "TD003",   # Missing issue link in TODO
]
unfixable = ["B028"] # People should intentionally tune the stacklevel

flake8-annotations.allow-star-arg-any = true
flake8-annotations.mypy-init-return = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
force-single-line = false
combine-as-imports = true
known-first-party = ["deepagents_cli"]

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-var-parameters = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN001", "ANN201", "D1", "DOC", "F401", "PLC1901", "PLC2701", "PLR2004", "PLR6201", "PLR6301", "PLW0108", "RUF001", "S", "SLF"]
"tests/unit_tests/test_imports.py" = ["PLC0415"]  # Imports inside function ARE the test
"scripts/**" = ["BLE001", "INP", "S", "T201"]
"deep_worker_cli/agent.py" = [
    "PLR2004",  # Magic value used in comparison
    "SIM108",   # Use ternary operator instead of if-else
]
"deep_worker_cli/app.py" = [
    "ANN401",   # Dynamically typed expressions (typing.Any) are disallowed
    "ARG002",   # Unused method argument
    "ASYNC110", # Use `asyncio.Event` instead of busy-waiting
    "BLE001",   # Do not catch blind exception
    "PLC0415",  # Lazy import for startup performance and optional deps
    "PLR2004",  # Magic value used in comparison
    "SIM108",   # Use ternary operator instead of if-else
]
"deep_worker_cli/backends.py" = [
    "PLC0415",  # Lazy import for monkey-patching at runtime
]
"deep_worker_cli/cli.py" = [
    "T201",     # `print` found
]
"deep_worker_cli/clipboard.py" = [
    "BLE001",   # Do not catch blind exception
    "PLC0415",  # Lazy import for optional dependency (pyperclip)
]
"deep_worker_cli/config.py" = [
    "ERA001",   # Found commented-out code
    "PLC0415",  # Conditional imports for model providers
    "PLR2004",  # Magic value used in comparison
]
"deep_worker_cli/file_ops.py" = [
    "ANN401",   # Dynamically typed expressions (typing.Any) are disallowed
    "BLE001",   # Do not catch blind exception
]
"deep_worker_cli/image_utils.py" = [
    "BLE001",   # Do not catch blind exception
]
"deep_worker_cli/input.py" = [
    "BLE001",   # Do not catch blind exception
    "PLR6301",  # Method could be a function or static method
]
"deep_worker_cli/integrations/daytona.py" = [
