]
"deep_worker_cli/integrations/langsmith.py" = [
    "PLC0415",  # Lazy import for optional dependency (langsmith)
]
"deep_worker_cli/integrations/modal.py" = [
    "PLC0415",  # Lazy import for optional dependency (modal)
