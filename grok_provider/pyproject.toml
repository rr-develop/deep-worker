[project]
name = "grok-provider"
version = "0.1.0"
description = "xAI Grok CLI provider for deep-worker with full LangChain compatibility"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.3.0",
    # MCP Python SDK — the in-agent-process HTTP MCP server is mounted on its
    # streamable_http transport. The grok CLI is driven over ACP (JSON-RPC on
    # ``grok agent stdio``); no runtime dep on any grok SDK.
    "mcp>=1.0.0",
    "uvicorn>=0.24.0",
    "starlette>=0.27.0",
    "typing-extensions>=4.0",
]

[dependency-groups]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["grok_provider*"]

[tool.setuptools.package-data]
"grok_provider" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["grok_provider"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
    "assert False",
]
