<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Stats - Deep-Worker-Web</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        /* Matches the dark theme used by index.html. */
        body {
            padding: 20px;
            background: #0F1417;
            color: #DFE3E7;
        }

        .stats-container {
            max-width: 1200px;
            margin: 0 auto;
            background: #171C1F;
            border-radius: 8px;
            padding: 30px;
            border: 1px solid #40484C;
        }

        .stats-header {
            margin-bottom: 20px;
            border-bottom: 1px solid #40484C;
            padding-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .stats-header h2 {
            margin: 0 0 6px 0;
            color: #DFE3E7;
        }

        .stats-meta {
            color: #C0C8CD;
            font-size: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            font-size: 14px;
        }

        th, td {
            text-align: left;
            padding: 8px 10px;
            border-bottom: 1px solid #2A3236;
        }

        th {
            color: #C0C8CD;
            font-weight: 600;
            background: #1D2428;
        }

        .section-title {
            margin-top: 24px;
            color: #DFE3E7;
            font-size: 16px;
            font-weight: 600;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            background: #2A3236;
            color: #C0C8CD;
        }

        .n-a {
            color: #8A9196;
            font-style: italic;
        }

        .error-panel {
            background: #3A1D1D;
            border: 1px solid #7A3A3A;
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
            color: #F0C0C0;
            white-space: pre-wrap;
        }

        .num {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>
    <div class="stats-container">
        <div class="stats-header">
            <div>
                <h2 id="stats-agent">Agent Stats</h2>
                <div id="stats-meta" class="stats-meta"></div>
            </div>
            <button id="copy-btn" class="btn btn-secondary btn-sm" disabled>📋 Copy</button>
            <button id="refresh-btn" class="btn btn-secondary btn-sm">🔄 Refresh</button>
        </div>
        <div id="stats-content">
            <p class="loading">Loading stats...</p>
        </div>
    </div>
    <script src="/static/js/stats.js"></script>
</body>
</html>
