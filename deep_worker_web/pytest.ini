[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
# Default collection excludes `tests/test_*.py` at the project root:
# those are Playwright-based UI / subprocess-server e2e tests that
# spawn their own uvicorn/browser and must be run deliberately
# (e.g. `pytest tests/test_ui_visual.py`). The unit + integration
# suites live under `tests/unit/` and `tests/integration/`.
norecursedirs =
    screenshots
    __pycache__
# Default marker selection: skip UI and integration so the normal
# `pytest tests/` run is fast and hermetic. Override at call time
# with `-m integration` or `-m ui` when needed.
# ``--strict-markers`` is what makes the selection above trustworthy: without
# it a typo'd ``@pytest.mark.integrationn`` is silently ignored and the test
# lands back in the default run. ``--strict-config`` is the same for this file.
addopts = -m "not ui and not integration" --strict-markers --strict-config
# Disable warnings for cleaner output
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
# Custom markers
markers =
    integration: Integration tests that require real agents (select with '-m integration')
    ui: UI visual tests using Playwright (select with '-m ui')
    live: Live UI tests that start their own server subprocess
    # pytest-timeout is a dev extra; the plugin registers this mark itself when
    # installed, but with --strict-markers an absent plugin would turn every
    # file carrying @pytest.mark.timeout into a collection error. Four files
    # under tests/integration/ use it. Duplicate registration is harmless.
    timeout: Per-test wall-clock budget, enforced only when pytest-timeout is installed
