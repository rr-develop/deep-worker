[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
# Disable warnings for cleaner output
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
# Custom markers
markers =
    integration: Integration tests that require real agents (deselect with '-m "not integration"')
    ui: UI visual tests using Playwright (deselect with '-m "not ui"')
