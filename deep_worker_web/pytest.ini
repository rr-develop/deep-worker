[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
# Default collection excludes `tests/test_*.py` at the project root:
# those are Playwright-based UI / subprocess-server e2e tests that
# spawn their own uvicorn/browser and must be run deliberately
# (e.g. `pytest tests/test_ui_visual.py`). The unit + integration
# suites live under `tests/unit/` and `tests/integration/`.
norecursedirs =
    screenshots
    __pycache__
# Default marker selection: skip UI and integration so the normal
# `pytest tests/` run is fast and hermetic. Override at call time
# with `-m integration` or `-m ui` when needed.
addopts = -m "not ui and not integration"
# Disable warnings for cleaner output
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
# Custom markers
markers =
    integration: Integration tests that require real agents (select with '-m integration')
    ui: UI visual tests using Playwright (select with '-m ui')
    live: Live UI tests that start their own server subprocess
