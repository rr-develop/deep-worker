[project]
name = "arpyc"
version = "0.1.0"
description = "Async RPyC Adapter - asyncio integration layer for RPyC"
requires-python = ">=3.11"
dependencies = [
    "rpyc>=6.0.0",
]
authors = [
    {name = "ARPyC Contributors"},
]
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "pyright>=1.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=arpyc --cov-report=term-missing"

[tool.coverage.run]
source = ["arpyc"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
