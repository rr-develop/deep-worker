[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# ``--strict-markers`` turns a typo'd mark into a COLLECTION ERROR instead of a
# silently-ignored one. Without it a mistyped ``@pytest.mark.integrationn``
# quietly puts an integration test back into the default selection: measured on
# this repo, ``-m 'not integration'`` then deselected 2 instead of 3 and exited
# 0, so a test that needs a live adapter ran as a unit test and went red for
# the wrong reason. ``--strict-config`` is the same contract for this file.
#
# Every custom mark used anywhere in the repo MUST be registered below, because
# the root config is the one pytest picks for a MIXED selection (repo-root paths
# plus package paths — e.g. the "Run provider unit tests" CI step), and
# ``--strict-markers`` then holds the whole run to this list. The package's own
# pyproject registers its own; this file has to cover the union.
addopts = --import-mode=importlib --strict-markers --strict-config
markers =
    integration: requires a live agent/adapter/credentials or runs an in-process server topology; deselected with -m 'not integration'
    integration_ai: real-agent end-to-end suite (tests/integration_ai)
    ui: Playwright UI visual test (deep_worker_web)
    live: starts its own server subprocess (deep_worker_web)
    real_cli: drives the real Claude CLI subprocess and MUST see the real $HOME
    requires: needs the named optional third-party package(s)
    reuse_agent: reuse an existing agent process instead of killing it
    allow_live_home: opt out of the autouse HOME-isolation fixture
    # ``timeout`` belongs to the pytest-timeout plugin, which is a DEV EXTRA:
    # CI installs neither it nor the extra. The plugin registers this mark
    # itself when present, but under --strict-markers an absent plugin would
    # make every file carrying @pytest.mark.timeout fail COLLECTION (verified:
    # `-p no:timeout` + --strict-markers -> "'timeout' not found in markers
    # configuration"). Registering it here is what keeps the mark declarative
    # when the plugin is missing; duplicate registration with the plugin is
    # harmless.
    timeout: per-test wall-clock budget, enforced only when pytest-timeout is installed
